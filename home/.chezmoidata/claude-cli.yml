claudeCli:
  marketplaces:
    - anthropics/claude-plugins-official
    - https://github.com/wakatime/claude-code-wakatime.git
    - matcra587/claude-themes
  plugins:
    - gopls-lsp@claude-plugins-official
    - typescript-lsp@claude-plugins-official
    - pyright-lsp@claude-plugins-official
    - claude-code-wakatime@wakatime
    - catppuccin@claude-themes
  statusline:
    modelColors:
      fable: mauve
      opus: peach
      sonnet: blue
      haiku: green
      unknown: red
    usageBase: blue
    usageThresholds:
      - at: 90
        color: red
      - at: 80
        color: maroon
      - at: 70
        color: peach
      - at: 50
        color: yellow
    effortColors:
      low: yellow
      medium: green
      high: blue
      xhigh: pink
      max: pink
      unknown: red
