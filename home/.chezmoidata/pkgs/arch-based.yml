# Arch-based package lists (Arch, CachyOS, EndeavourOS) — installed with `yay`.
#
# Shape (identical to ubuntu-based.yml so the installers stay symmetrical):
#
#   pkgs.archBased.<category>.cli   always installed when the category applies
#   pkgs.archBased.<category>.gui   installed only when .isGui  (skipped on WSL,
#                                   containers and headless servers)
#
# Categories and when they apply:
#   common    always
#   personal  when "personal" is in .profiles
#   work      when .isWork  (any company profile present)
#   laptop    when .isLaptop
#
# See home/.chezmoiscripts/linux/run_once_before_10-install-pkgs-arch-based.sh.tmpl

pkgs:
  archBased:
    common:
      cli:
        # Core
        - base-devel
        - chezmoi
        - git
        - git-lfs
        - lsb-release
        - rsync
        - tree
        - unzip
        - wget
        - zip
        - zsh

        # Editors + the toolchain neovim plugins expect
        - neovim
        - vim
        - cmake
        - luarocks
        - tree-sitter-cli

        # Shell / prompt / terminal UX
        - bat
        - ctags
        - diffnav
        - dust
        - eza
        - fastfetch
        - fd
        - fzf
        - glow
        - htmlq
        - jq
        - jqp-bin # aur
        - just
        - procs
        - ripgrep
        - starship
        - tldr
        - tmux
        - tmuxinator
        - xh
        - yazi
        - resvg # yazi: SVG preview
        - yq # mise requirements
        - zoxide

        # Git / forge
        - gh
        - gh-dash-bin
        - gh-enhance-bin
        - git-delta
        - github-cli
        - glab # gitlab cli (work forges)
        - lazygit

        # Containers, cloud, k8s
        - aws-cli-v2
        - docker
        - docker-buildx
        - docker-compose
        - fluxcd
        - helm
        - kubecolor
        - kubectl
        - lazydocker
        - lstk # localstack cli
        # - cmctl

        # Databases / APIs / messaging
        - ktea # kafka
        - lazysql-bin
        - openapi-tui
        - pgcli
        - rustfs

        # Toolchains
        - bun
        - go
        - mise
        - nodejs
        - npm
        - rust
        - rustup
        - uv
        # - pnpm
        # - pyenv
        # - python-pip
        # - yarn

        # Security
        - age
        - gnupg
        - openssl
        - sops

        # Monitoring / system
        - btop
        - cronie
        - dysk
        - gdu
        - inotify-tools
        - websocat

        # Network
        - doggo
        - rclone
        # - dog

        # AI / agents
        - agent-browser-bin
        - ast-grep-bin
        - claude # aur
        - markitdown-bin # aur
        - opencode
        - rtk-bin # aur
        - wakatime
        - mermaid-cli

        # Misc runtime deps
        - bc
        - fuse3 # For rclone mount --daemon
        - usage # For mise

      gui:
        # Terminals
        - alacritty
        - kitty
        # - ghostty

        # Editors / IDE
        - visual-studio-code-bin
        # - mysql-workbench
        # - zed

        # Fonts
        - maplemono-nf
        - noto-fonts-emoji
        - ttf-google-sans
        - ttf-jetbrains-mono-nerd
        - ttf-nerd-fonts-symbols

        # Clipboard (neovim "+" register, yazi clipboard support)
        - wl-clipboard
        - xclip
        - xsel

        # Desktop plumbing
        - gnome-keyring # For MySQL Workbench,...
        - gtk4
        - wtype
        - xorg-xhost

    personal:
      cli:
        - os-prober
        - qbittorrent-tui-bin

        # CLI fun
        - asciinema
        - asciinema-agg-bin
        - astroterm
        - cowsay
        - figlet # A program for making large letters out of ordinary text
        - lolcat
        # - speedtest-cli

      gui:
        # Browsers
        - brave-bin
        - chromium
        # - google-chrome

        # Media / documents
        - libreoffice-fresh
        - obs-studio
        - qbittorrent
        - spotify
        - vlc
        - zathura
        - zathura-pdf-mupdf # For zathura
        - tesseract-data-eng # For zathura
        - tesseract-data-vie # For zathura

        # Input method (Vietnamese)
        - fcitx5
        - fcitx5-configtool
        - fcitx5-lotus-bin
        # - fcitx5-bamboo

        # Desktop utilities
        - grub-customizer
        - kanata-bin
        - tailscale
        - hyprwhspr # aur: Native speech-to-text for Linux
        - livecaptions # aur: live captioning
        - wayscriber-bin # aur: live drawing/annotation overlay
        # - gammastep
        # - screenkey

    work:
      cli: []
      gui: []

    laptop:
      cli:
        - tlp
        - tlp-rdw
      gui:
        - tlpui
        # - gestures
        # - libinput-gestures
